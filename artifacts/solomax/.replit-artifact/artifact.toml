kind = "web"
previewPath = "/"
title = "SoloMax Studios"
version = "1.0.0"
id = "artifacts/solomax"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18532

[services.development]
run = "pnpm --filter @workspace/solomax run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solomax", "run", "build" ]
publicDir = "artifacts/solomax/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18532"
BASE_PATH = "/"
